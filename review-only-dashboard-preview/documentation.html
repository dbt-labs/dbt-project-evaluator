    <style>
                /* No @font-face here on purpose. The board SVG below is inline in this
           document, so the @font-face rules in its own <style> are document-level
           and serve this stylesheet too. Declaring them twice would embed a second
           copy of every font's bytes in an export. */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: "Inter Variable", "Noto Emoji", "Inter", system-ui, sans-serif;
            background-color: #FFFFFF;
        }
        .dbt-charts-wrapper {
            width: 100%;
            margin: 0 auto;
        }
        .dbt-charts-svg-container {
            width: 100%;
        }
        /* The control layer is absolutely positioned over the anchor box the
           board SVG reserves for its variables strip, so the board is its
           containing block. */
        .dbt-charts-board {
            position: relative;
        }
        /* Fit width. The board is a fixed-viewBox SVG carrying its intrinsic
           content width as a presentation attribute; a stylesheet width
           outranks that attribute, so width:100% + height:auto scales the whole
           board to the window and reflows on resize with zero JS. The SVG stays
           intrinsically sized as an artifact — only this HTML host stretches it.
           Child combinator on purpose: a descendant selector would also hit the
           nested per-row/per-chart svg viewports, whose CSS-overridden height
           (auto → 100%) re-centers their viewBox content and breaks row layout. */
        .dbt-charts-svg-container > svg {
            width: 100%;
            height: auto;
        }
        /* View modes, set by the nav's view control on <html>. Fit width is the
           default above, so it needs no class — picking it just removes these.
           Both alternates release the width and let the SVG's own viewBox ratio
           size it, then center what is left over. */
        .dbt-view-fit-height .dbt-charts-svg-container > svg {
            width: auto;
            height: calc(100vh - var(--dbt-view-chrome, 0px));
            max-width: 100%;
        }
        .dbt-view-actual .dbt-charts-svg-container > svg {
            width: auto;
            height: auto;
            max-width: none;
        }
        /* The board is display:block (set inline by the artifact), so it centers
           with auto margins — text-align on the container would do nothing. */
        .dbt-view-fit-height .dbt-charts-svg-container > svg,
        .dbt-view-actual .dbt-charts-svg-container > svg {
            margin-inline: auto;
        }
        /* 100% on a board wider than the window still has to be reachable. */
        .dbt-view-actual .dbt-charts-svg-container {
            overflow-x: auto;
        }
    </style>
    <style>


.dbt-popover {
  display: none;
  position: absolute;
  background: var(--dbt-popover-bg, #ffffff);
  border: 1px var(--dbt-system-input-border-style, solid) var(--dbt-system-input-border, #ced4da);
  border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.10);
  overflow: hidden;
  z-index: 100;
  font-family: 'Inter Variable', Inter, system-ui, -apple-system, sans-serif;
}

.dbt-popover.dbt-popover-open {
  display: flex;
}

.dbt-select-popover {
  flex-direction: column;
  padding: 4px 0;
  max-height: 280px;
  overflow-y: auto;
  min-width: 140px;
}

.dbt-select-option {
  padding: 6px 14px;
  cursor: pointer;
  white-space: nowrap;
  color: var(--dbt-system-text, #333333);
  font-size: 13px;
}

.dbt-select-option:hover {
  background: color-mix(in srgb, var(--dbt-system-muted, #6c757d) 12%, transparent);
}


.dbt-select-unset {
  color: var(--dbt-system-muted, #6c757d);
  font-style: italic;
  border-bottom: 1px solid var(--dbt-system-input-border, #ced4da);
}


.dbt-select-option[aria-selected="true"] {
  background: var(--dbt-system-accent, #667eea);
  color: white;
}


[aria-multiselectable="true"] .dbt-select-option {
  position: relative;
  padding-left: 34px;
}

[aria-multiselectable="true"] .dbt-select-option:not(.dbt-select-unset)::before {
  content: "";
  position: absolute;
  left: 12px;
  top: 50%;
  width: 14px;
  height: 14px;
  box-sizing: border-box;
  transform: translateY(-50%);
  border: 1px solid var(--dbt-system-input-border, #ced4da);
  border-radius: 3px;
  background: var(--dbt-popover-bg, #ffffff);
}

[aria-multiselectable="true"] .dbt-select-option:not(.dbt-select-unset)[aria-selected="true"] {
  background: none;
  color: inherit;
}

[aria-multiselectable="true"] .dbt-select-option:not(.dbt-select-unset)[aria-selected="true"]::before {
  border-color: var(--dbt-system-accent, #667eea);
  background: var(--dbt-system-accent, #667eea);
}


[aria-multiselectable="true"] .dbt-select-option:not(.dbt-select-unset)[aria-selected="true"]::after {
  content: "";
  position: absolute;
  left: 17px;
  top: 50%;
  width: 4px;
  height: 8px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: translateY(-62%) rotate(45deg);
}



.dbt-variable-overlay:focus,
.dbt-variable-overlay:focus-visible {
    outline: none;
}

.dbt-variable-overlay {
  background: var(--dbt-popover-bg, #ffffff);
  border: 1px var(--dbt-system-input-border-style, solid) var(--dbt-system-input-border, #ced4da);
  border-radius: var(--dbt-system-radius, 4px);
  color: var(--dbt-system-text, #333333);
  font-family: 'Inter Variable', Inter, system-ui, -apple-system, sans-serif;
  font-size: 13px;
  padding: 0 8px;
  z-index: 100;
}


.dbt-daterange-popover {
  flex-direction: row;
}


.dbt-preset-rail {
  width: 164px;
  border-right: 1px solid var(--dbt-system-input-border, #ced4da);
  padding: 10px 0;
  flex-shrink: 0;
  background: var(--dbt-popover-rail-bg, #fafafa);
}

.dbt-preset-rail button {
  display: block;
  width: 100%;
  padding: 7px 16px;
  text-align: left;
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  color: var(--dbt-system-text, #333333);
}

.dbt-preset-rail button:hover {
  background: color-mix(in srgb, var(--dbt-system-muted, #6c757d) 12%, transparent);
}

.dbt-preset-rail button.dbt-preset-active {
  background: var(--dbt-system-accent, #667eea);
  color: white;
}

.dbt-preset-divider {
  height: 1px;
  background: var(--dbt-system-input-border, #ced4da);
  margin: 6px 12px;
}


.dbt-calendar-area {
  padding: 14px;
  flex-shrink: 0;
  width: 272px;
}

.dbt-cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  padding: 0 4px;
}

.dbt-cal-nav {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  color: var(--dbt-system-text, #333333);
  padding: 2px 8px;
  border-radius: 3px;
}

.dbt-cal-nav:hover {
  background: color-mix(in srgb, var(--dbt-system-muted, #6c757d) 12%, transparent);
}


.dbt-cal-month {
  font-weight: 500;
  font-size: 14px;
  min-width: 130px;
  text-align: center;
  color: var(--dbt-system-text, #333333);
}


.dbt-cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 34px);
  gap: 0;
}

.dbt-cal-dow {
  font-size: 11px;
  color: var(--dbt-system-muted, #6c757d);
  text-align: center;
  padding: 6px 0 4px;
  font-weight: 500;
}

.dbt-cal-cell {
  text-align: center;
  padding: 7px 0;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  border-radius: 3px;
  background: none;
  border: none;
  color: var(--dbt-system-text, #333333);
  min-height: 18px;
}

.dbt-cal-cell.dbt-other-month {
  color: var(--dbt-placeholder-color, var(--dbt-system-muted, #6c757d));
}

.dbt-cal-cell:hover {
  background: color-mix(in srgb, var(--dbt-system-muted, #6c757d) 12%, transparent);
}


.dbt-cal-cell.dbt-in-range,
.dbt-cal-cell.dbt-preview-in-range {
  background: color-mix(in srgb, var(--dbt-system-accent, #667eea) 28%, transparent);
  color: var(--dbt-system-text, #333333);
}


.dbt-cal-cell.dbt-selected {
  background: var(--dbt-system-accent, #667eea);
  color: white;
  font-weight: 500;
}


.dbt-cal-cell.dbt-preview-end {
  background: transparent;
  color: var(--dbt-system-accent, #667eea);
  font-weight: 500;
  box-shadow: inset 0 0 0 1px var(--dbt-system-accent, #667eea);
}


.dbt-cal-cell.dbt-selected.dbt-range-start { border-radius: 3px 0 0 3px; }
.dbt-cal-cell.dbt-selected.dbt-range-end   { border-radius: 0 3px 3px 0; }
.dbt-cal-cell.dbt-selected.dbt-range-start.dbt-range-end { border-radius: 3px; }


.dbt-cal-cell.dbt-today:not(.dbt-selected):not(.dbt-preview-end) {
  font-weight: 700;
}



.dbt-cal-footer {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--dbt-system-input-border, #ced4da);
  align-items: center;
  justify-content: flex-end;
}

.dbt-cal-action[data-action="clear"] {
  margin-right: auto;
}

.dbt-cal-action {
  padding: 6px 12px;
  background: none;
  border: 1px var(--dbt-system-input-border-style, solid) var(--dbt-system-input-border, #ced4da);
  border-radius: 4px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  color: var(--dbt-system-text, #333333);
}

.dbt-cal-action:hover {
  background: color-mix(in srgb, var(--dbt-system-muted, #6c757d) 10%, transparent);
  border-color: var(--dbt-system-muted, #6c757d);
}


.dbt-cal-action-primary {
  background: var(--dbt-system-accent, #667eea);
  color: white;
  border-color: var(--dbt-system-accent, #667eea);
}

.dbt-cal-action-primary:hover {
  background: color-mix(in srgb, var(--dbt-system-accent, #667eea) 85%, black);
  border-color: color-mix(in srgb, var(--dbt-system-accent, #667eea) 85%, black);
}


.dbt-chart-loading {
  pointer-events: none;
}

.dbt-chart-loading > :not(.dbt-chart-spinner) {
  opacity: 0.5;
}
@keyframes dbt-spin {
  to { transform: rotate(360deg); }
}




.dbt-chart text {
    cursor: text;
    pointer-events: auto;
}

.dbt-chart text::selection {
    background: rgba(102, 126, 234, 0.25);
}


.dbt-chart-highlight-overlay {
    fill: none;
    stroke: var(--dbt-system-accent, #667eea);
    stroke-width: 3;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.15s ease-in-out;
}


.dbt-interactive [data-dbt-field] {
    stroke: var(--dbt-variable-field-border);
    stroke-width: 1;
}

.dbt-interactive [data-dbt-variable] {
    cursor: pointer;
}


.dbt-interactive [data-dbt-ornament="arrow"],
.dbt-interactive [data-dbt-ornament="calendar"] {
    opacity: 1;
}


.dbt-interactive [data-dbt-variable][data-dbt-enabled="false"] {
    cursor: not-allowed;
}


.dbt-interactive [data-dbt-variable]:focus,
.dbt-interactive [data-dbt-variable]:focus-visible {
    outline: none;
}


.dbt-interactive [data-dbt-variable]:is(:focus, :focus-visible, [data-dbt-active]) [data-dbt-field],
.dbt-variable-overlay:focus {
    stroke: var(--dbt-system-accent, #667eea);
    border-color: var(--dbt-system-accent, #667eea);
}


.dbt-interactive [data-dbt-ornament="slider-thumb"] {
    pointer-events: none;
}


.dbt-footer-link {
    cursor: pointer;
}

.dbt-footer-link:hover {
    text-decoration: underline;
}


.dbt-chart .dbt-table-link:hover .dbt-table-link-text,
.dbt-chart a:focus-visible .dbt-table-link-text {
  text-decoration-line: underline;
  text-decoration-style: solid;
  text-decoration-thickness: 1px;
  text-underline-offset: 1px;
  text-decoration-color: currentColor;
}

.dbt-chart a:focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 2px;
}


.dbt-chart text.dbt-table-cell-inert,
.dbt-chart text.dbt-paginator-glyph {
  pointer-events: none;
  cursor: pointer;
}


.dbt-pointer-inert,
.dbt-chart text.dbt-pointer-inert {
  pointer-events: none;
}


.dbt-chart .dbt-box-outer {
  pointer-events: none;
}

.dbt-chart .dbt-box-inner {
  pointer-events: all;
}


.dbt-chart .dbt-page-target {
  pointer-events: all;
  cursor: pointer;
}

.dbt-chart .dbt-paginator text,
.dbt-chart text.dbt-paginator-label {
  user-select: none;
}


.dbt-table-row-link {
  cursor: pointer;
}

.dbt-table-row-link:hover {
  fill: color-mix(in srgb, var(--dbt-link) 8%, transparent);
}

.dbt-details-toggle {
  cursor: pointer;
}</style>

</head>

    function panelScope(mark, chartEl) {

    function collectMatchingMarks(svg, hoveredMark, hoveredEntries) {
        if (!markHeaderEntry(hoveredEntries)) return [{ mark: hoveredMark, entries: hoveredEntries }];
        const identity = headerKey(hoveredEntries);

         
         
         
         
         
         
        const chartScope = hoveredMark.closest('.dbt-chart') || svg;

        matchScope.querySelectorAll('[aria-label]').forEach(function (candidate) {
            if (!isDataMark(candidate)) return;
            const entries = parseAriaLabel(candidate.getAttribute('aria-label'));
            if (!markHeaderEntry(entries) || headerKey(entries) !== identity) return;

            const series = markSeriesEntry(entries);
            const key = identity + '|' + (series ? series.value : '');
            if (seen[key]) return;
            seen[key] = true;
            matches.push({ mark: candidate, entries: entries });
        });

        const order = legendSeriesOrder(chartScope);
        const hasLegendOrder = Object.keys(order).length > 0;
        const hasBakedOrder = matches.some(function (m) { return markOrderEntry(m.entries); });
        if (hasLegendOrder || hasBakedOrder) {
            matches.forEach(function (m, idx) { m._i = idx; });
            matches.sort(function (a, b) {
                const oa = markOrderEntry(a.entries);
                const ob = markOrderEntry(b.entries);
                const sa = markSeriesEntry(a.entries);
                const sb = markSeriesEntry(b.entries);
                 
                 
                 
                const ka = sa && sa.value in order ? order[sa.value] : (oa ? orderRank(oa) : Infinity);
                const kb = sb && sb.value in order ? order[sb.value] : (ob ? orderRank(ob) : Infinity);
                return ka !== kb ? ka - kb : a._i - b._i;
            });
        }
        return matches;
    }

     
     
     
    function buildRowPlan(matches, hoveredMark) {
        if (matches.length <= MAX_XUNIFIED_ROWS) {
            return { shown: matches, remainder: [] };
        }
        let hoveredIndex = -1;
        for (let i = 0; i < matches.length; i++) {
            if (matches[i].mark === hoveredMark) { hoveredIndex = i; break; }
        }
        const visibleCount = MAX_XUNIFIED_ROWS - 1;
        let shown = matches.slice(0, visibleCount);
        if (hoveredIndex >= visibleCount) {
            shown = shown.slice(0, visibleCount - 1).concat([matches[hoveredIndex]]);
        }
        const shownMarks = shown.map(function (m) { return m.mark; });
        const remainder = matches.filter(function (m) { return shownMarks.indexOf(m.mark) === -1; });

    const HOVER_SNAP_RADIUS_PX = 24;

     
     
     
     
     
    function nearestDataMark(chart, x, y, maxDistance, accept) {

            if (!isDataMark(mark)) return;
            if (accept && !accept(mark)) return;

            const rect = mark.getBoundingClientRect();
            const dx = Math.max(rect.left - x, 0, x - rect.right);
            const dy = Math.max(rect.top - y, 0, y - rect.bottom);
            const distance = dx * dx + dy * dy;
            if (distance < nearestDistance) {
                nearest = mark;
                nearestDistance = distance;
            }
        });

        return nearest;
    }

    function yAxisBands(chartEl) {

            if (r.height <= 0) return;
            for (let i = 0; i < bands.length; i++) {
                const b = bands[i];
                const overlap = Math.min(b.bottom, r.bottom) - Math.max(b.top, r.top);
                if (overlap > 0.5 * Math.min(b.bottom - b.top, r.height)) {

                    b.bottom = Math.max(b.bottom, r.bottom);

        return '<div style="padding:2px ' + paddingRight + ' 2px ' + paddingLeft + ';' + (activeBg || '') + radius + style + '">' + html + '</div>';
    }

     
     
     
     
     
    function xUnifiedRow(entries, seriesColor, isActive, ts, hasPercent, asLine, recede) {
        const series = markSeriesEntry(entries);
        const values = entries.filter(function (e) { return e.role === 'value'; });
        const label = series ? formatValue(series.value) : (values[0] ? formatFieldName(values[0].label) : '');
        const swatch = seriesColor ? seriesSwatch(seriesColor, asLine) : '';

         
         
         
         
        const useTriangle = ts.activeMarker === 'triangle';
        const activeBg = (isActive && !useTriangle) ? 'background:rgba(127,127,127,0.16);' : '';
        const marker = (isActive && useTriangle) ? triangleMarker(ts) : '';

        const swatchCell = xUnifiedCell(marker + swatch, 'position:relative;', activeBg, true, false);
        const nameCell = xUnifiedCell(label, 'color:' + ts.label.font.color + ';', activeBg, false, false);

         
         
        const valueWeight = 'font-weight:' + ts.value.font.weight + ';';

        let pctCell = '';
        let valueText;
        if (hasPercent) {
            pctCell = xUnifiedCell(
                formatValue(values[0].value),
                'text-align:right;color:' + ts.value.font.color + ';' + valueWeight + 'font-variant-numeric:tabular-nums lining-nums;',
                activeBg, false, false
            );
            valueText = values.length > 1 ? formatValue(values[values.length - 1].value) : '';
        } else {
            valueText = values[0] ? formatValue(values[0].value) : '';
        }
         
         
         
         
        const valueColor = (hasPercent || recede) ? ts.label.font.color : ts.value.font.color;
        const valueCell = xUnifiedCell(
            valueText,
            'text-align:right;color:' + valueColor + ';' + valueWeight + 'font-variant-numeric:tabular-nums lining-nums;',
            activeBg, false, true
        );

        return swatchCell + nameCell + pctCell + valueCell;
    }

     
     
     
     
     
     
     
     
    function xUnifiedRemainderRow(remainder, ts, hasPercent) {
        const swatchCell = xUnifiedCell('', '', '', true, false);
        const nameCell = xUnifiedCell('+' + remainder.length + ' more', 'font-style:italic;color:' + ts.label.font.color + ';', '', false, false);
        const pctCell = hasPercent ? xUnifiedCell('', '', '', false, false) : '';
        const valueCell = xUnifiedCell('', '', '', false, true);
        return swatchCell + nameCell + pctCell + valueCell;
    }

     
     
     
    function xUnifiedHeaderCell(headerEntriesList, ts) {
        const inner = headerEntriesList.map(function (h) { return headerRow(h, null, ts); }).join('');
        return '<div style="grid-column:1/-1;border-bottom:' + DIVIDER_WIDTH + 'px solid ' + ts.border.color + ';padding-bottom:4px;margin-bottom:4px;">' + inner + '</div>';
    }

     
     
     
     
    function xUnifiedTotalRow(entry, ts, hasPercent) {
        const borderTop = 'border-top:' + DIVIDER_WIDTH + 'px solid ' + ts.border.color + ';';
        const labelSpan = hasPercent ? '1 / span 3' : '1 / span 2';
        const label = (
            '<div style="grid-column:' + labelSpan + ';' + borderTop +
                'margin-top:4px;padding:4px 8px 0 0;color:' + ts.label.font.color + ';font-weight:' + ts.value.font.weight + ';">' +
                formatFieldName(entry.label) +
            '</div>'
        );
         
         
         
         
        const totalColor = hasPercent ? ts.label.font.color : ts.value.font.color;
        const value = (
            '<div style="' + borderTop + 'margin-top:4px;padding:4px 6px 0 0;text-align:right;color:' +
                totalColor + ';font-weight:' + ts.value.font.weight + ';font-variant-numeric:tabular-nums lining-nums;">' +
                formatValue(entry.value) +
            '</div>'
        );
        return label + value;
    }

     
     
     
     
     
     
     
     
     
    function carriesGroupTotal(match) {
        return match.entries.some(function (e) { return e.role === 'total'; });
    }

     
     
     
     
     
     
     
     
     
     
     
     
     
     
     
     
     
    function xUnifiedHtml(hoveredMark, hoveredEntries, matches, ts) {
        const plan = buildRowPlan(matches, hoveredMark);
        const hasPercent = matches.some(function (m) {
            return m.entries.filter(function (e) { return e.role === 'value'; }).length > 1;
        });
        const columns = hasPercent ? 'auto minmax(0,1fr) auto auto' : 'auto minmax(0,1fr) auto';
         
         
         
         
        const overlayLeads = plan.shown.length > 0 && !carriesGroupTotal(plan.shown[0]) &&
            plan.shown.some(carriesGroupTotal);
        const totalEntry = overlayLeads ? null : findTotalEntry(matches);
        function renderRow(m, i) {
            return xUnifiedRow(
                m.entries, markSeriesColor(m.mark), m.mark === hoveredMark, ts, hasPercent,
                isStrokedMark(m.mark), overlayLeads && i > 0
            );
        }

        let html = '<div style="display:grid;grid-template-columns:' + columns + ';column-gap:0;align-items:center;">';
        html += xUnifiedHeaderCell(headerEntries(hoveredEntries), ts);
        if (totalEntry) {
            const baseShown = plan.shown.filter(carriesGroupTotal);
            const overlayShown = plan.shown.filter(function (m) { return !carriesGroupTotal(m); });
            html += baseShown.map(renderRow).join('');
            if (plan.remainder.length) {
                html += xUnifiedRemainderRow(plan.remainder, ts, hasPercent);
            }
            html += xUnifiedTotalRow(totalEntry, ts, hasPercent);
            // Detach the overlay reference row(s) (combo target/goal) from the
            // parts+total group: the sum line above the total already binds the
            // total to the parts it sums, so a target sitting flush below reads
            // as "grouped with the total". A full-width gap re-frames it as a
            // separate comparison against that total, not a member of the stack.
            if (overlayShown.length) {
                html += '<div style="grid-column:1/-1;height:' + OVERLAY_DETACH_GAP + 'px;"></div>';
            }
            html += overlayShown.map(renderRow).join('');
        } else {
            html += plan.shown.map(renderRow).join('');
            if (plan.remainder.length) {
                html += xUnifiedRemainderRow(plan.remainder, ts, hasPercent);
            }
        }
        html += '</div>';
        return html;
    }

    function showTooltip(state, mark, event, svg) {
        const entries = parseAriaLabel(mark.getAttribute('aria-label'));
        if (!entries.length) {
            hideTooltip(state);
            return;
        }

        const ts = DCT_TOOLTIP_STYLE;
        state.activeMark = mark;
        const matches = svg ? collectMatchingMarks(svg, mark, entries) : [{ mark: mark, entries: entries }];
        const useXUnified = matches.length > 1 && matches.length <= XUNIFIED_ABANDON_THRESHOLD;

        state.tooltip.innerHTML = useXUnified
            ? xUnifiedHtml(mark, entries, matches, ts)
            : singleMarkHtml(entries, markSeriesColor(mark), ts);
        state.tooltip.style.display = 'block';
        positionTooltip(state, event.clientX, event.clientY);

         
         
         
         
         
        const kept = {};
        if (useXUnified) {
            matches.forEach(function (m) { kept[m.mark.getAttribute('aria-label')] = true; });
        } else {
             
             
             
            kept[mark.getAttribute('aria-label')] = true;
        }
        applyHoverEmphasis(state, mark, kept);
        applyHoverMarkers(state, mark, useXUnified ? matches : [{ mark: mark }]);
    }

     
     
    function initializeSvg(svg) {
        if (!svg.matches('[data-dbt-tooltip-style]') || svg.dataset.dbtHoverInitialized === 'true') {
            return;
        }

        svg.dataset.dbtHoverInitialized = 'true';
        readBoardConfig(svg);
        const state = ensureState();

        svg.addEventListener('mousemove', function (event) {
            const target = event.target;
            const labeledTarget = target && target.closest
                ? event.target.closest('[aria-label]')
                : null;
            let mark = labeledTarget && isDataMark(labeledTarget)
                ? labeledTarget
                : null;

             
             
             
            if (!mark && target && target.closest && target.closest(MARK_GROUP_SELECTOR)) {
                const chart = target.closest('.dbt-chart');
                if (chart) {
                    mark = nearestDataMark(chart, event.clientX, event.clientY);
                }
            }

             
             
             
             
             
             
             
             
             
             
             
             
             
             
            if (!mark && target && target.closest
                && !target.closest('.role-legend') && !target.closest('.role-title')) {
                const chart = target.closest('.dbt-chart');
                if (chart) {
                     
                     
                     
                     
                     
                    const panel = panelAtPoint(chart, event.clientX, event.clientY);
                    if (panel) {
                        mark = nearestDataMark(
                            panel, event.clientX, event.clientY, HOVER_SNAP_RADIUS_PX, isSnappableMark
                        );
                    }
                }
            }

            if (!mark || !svg.contains(mark)) {
                if (state.activeMark) {
                    hideTooltip(state);
                }
                return;
            }

            if (state.activeMark !== mark || state.tooltip.style.display === 'none') {
                showTooltip(state, mark, event, svg);
            } else {
                positionTooltip(state, event.clientX, event.clientY);
            }
        });

        svg.addEventListener('mouseleave', function () {
            hideTooltip(state);
        });
    }

     
     
    window.dbtChartHover = {
        mount: function (root) {
            const scope = root || document;
            if (scope.matches && scope.matches('svg')) initializeSvg(scope);
            scope.querySelectorAll('svg').forEach(initializeSvg);
        }
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { window.dbtChartHover.mount(); }, { once: true });
    } else {
        window.dbtChartHover.mount();
    }
})();
</script>
